<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<title>GitHub Actions에서 배포까지</title>
<!-- 렌더: 1120x800, deviceScaleFactor 2 → public/images/posts/commit-pinned-ci-deploy/01.png -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  html,body{margin:0;padding:0;background:#f6f6f6}
  svg{display:block}
  text{font-family:Pretendard,"Noto Sans CJK KR",sans-serif}
  .ind{fill:#6d73ce}
  .gry{fill:#666666}
  .pur{fill:#c075e7}
  .red{fill:#e54e4f}
  .rep{fill:#ffffff;stroke:#666666;stroke-width:2}
  .t{font-size:24px;font-weight:600;fill:#fff;text-anchor:middle}
  .s{font-size:16px;font-weight:500;fill:rgba(255,255,255,.88);text-anchor:middle}
  .tk{font-size:22px;font-weight:600;fill:#000;text-anchor:middle}
  .sk{font-size:16px;font-weight:500;fill:#666;text-anchor:middle}
  .band{fill:#e4e4e4}
  .bt{font-size:19px;font-weight:700;fill:#333}
  .life{fill:none;stroke:#999;stroke-width:1.6;stroke-dasharray:3 5}
  .a{fill:none;stroke:#000;stroke-width:2.2;marker-end:url(#ah)}
  .ad{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#ahg)}
  .act{fill:#d9daf3}
  .l{font-size:17px;font-weight:600;fill:#000}
  .ld{font-size:16px;font-weight:500;fill:#555}
  .nb{font-size:18px;font-weight:700;fill:#6d73ce}
  .m{text-anchor:middle}
  .e{text-anchor:end}
</style>
</head><body>
<svg id="fig" width="1120" height="800" viewBox="0 0 1120 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L10.5 6L1 11" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ahg" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L10.5 6L1 11" fill="none" stroke="#555" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1120" height="800" fill="#f6f6f6"/>

  <!-- 앞단: push → test -->
  <rect class="band" x="20" y="14" width="1080" height="40" rx="8"/>
  <text class="bt" x="40" y="41">master에 push → test 잡(mvn test) 통과 → deploy 잡 시작 (needs: test). 겹치면 서버에서 마지막 요청만 배포</text>

  <!-- 참여자 -->
  <rect class="ind" x="30" y="74" width="230" height="78" rx="10"/>
  <text class="t" x="145" y="106">deploy 잡</text>
  <text class="s" x="145" y="132">deploy-action → CLI</text>

  <rect class="rep" x="300" y="74" width="190" height="78" rx="10"/>
  <text class="tk" x="395" y="106">GitHub OIDC</text>
  <text class="sk" x="395" y="132">ID 토큰 발급</text>

  <rect class="pur" x="530" y="74" width="210" height="78" rx="10"/>
  <text class="t" x="635" y="106">core</text>
  <text class="s" x="635" y="132">API 서버</text>

  <rect class="gry" x="780" y="74" width="150" height="78" rx="10"/>
  <text class="t" x="855" y="106">builder</text>
  <text class="s" x="855" y="132">빌드 Job</text>

  <rect class="gry" x="960" y="74" width="140" height="78" rx="10"/>
  <text class="t" x="1030" y="106">Argo CD</text>
  <text class="s" x="1030" y="132">앱 Pod</text>

  <path class="life" d="M145 154V776"/>
  <path class="life" d="M395 154V236"/>
  <path class="life" d="M635 154V708"/>
  <path class="life" d="M855 154V600"/>
  <path class="life" d="M1030 154V600"/>

  <!-- ① ID 토큰 -->
  <path class="a" d="M147 190H393"/>
  <text class="nb" x="160" y="181">①</text>
  <text class="l" x="184" y="181">ID 토큰 요청</text>
  <path class="ad" d="M393 222H147"/>
  <text class="ld" x="200" y="244">서명된 JWT (aud=kodeploy)</text>

  <!-- ② 교환 -->
  <path class="a" d="M147 290H633"/>
  <text class="nb" x="160" y="281">②</text>
  <text class="l" x="184" y="281">POST /apps/{id}/ci/token</text>
  <rect class="act" x="628" y="296" width="14" height="40"/>
  <text class="ld e" x="618" y="316">검사 11개: 서명 · iss · aud · 시각 · jti</text>
  <text class="ld e" x="618" y="338">앱 · 이벤트 · 저장소/브랜치 · sha · 워크플로 · 저장소 ID</text>
  <path class="ad" d="M628 352H147"/>
  <text class="ld" x="200" y="374">CI 토큰 kdci_… (15분, 이 앱 · 이 커밋)</text>

  <!-- ③ 재배포 -->
  <path class="a" d="M147 416H633"/>
  <text class="nb" x="160" y="407">③</text>
  <text class="l" x="184" y="407">POST /apps/{id}/deploy/redeploy</text>
  <text class="ld" x="184" y="440">Bearer · Idempotency-Key gha-&lt;run_id&gt;-&lt;attempt&gt;</text>
  <path class="ad" d="M628 470H147"/>
  <text class="ld" x="200" y="492">202 빌드 id (같은 키면 200 replayed)</text>

  <!-- ④ 빌드 -->
  <path class="a" d="M642 520H853"/>
  <text class="nb" x="654" y="511">④</text>
  <text class="l" x="678" y="511">ref = 커밋 SHA</text>
  <rect class="act" x="848" y="526" width="14" height="44"/>
  <text class="ld e" x="840" y="552">fetch --depth 1</text>
  <text class="ld e" x="840" y="574">KODEPLOY_SOURCE_SHA</text>
  <path class="a" d="M862 560H1028"/>
  <text class="l" x="872" y="551">digest 커밋</text>
  <path class="ad" d="M848 596H642"/>
  <text class="ld" x="660" y="618">이벤트 (source_sha)</text>

  <!-- ⑤ 폴링 -->
  <path class="a" d="M147 654H633"/>
  <text class="nb" x="160" y="645">⑤</text>
  <text class="l" x="184" y="645">GET /apps/{id}/deploy/{build}</text>
  <text class="ld" x="184" y="678">2초 간격, 바뀌지 않으면 10초까지 늘림</text>
  <path class="ad" d="M628 704H147"/>
  <text class="ld" x="200" y="726">queued → building → deploying → running, 그 뒤 60초 더 지켜봄 (settle)</text>

  <!-- ⑥ exit code -->
  <rect class="act" x="140" y="740" width="14" height="40"/>
  <text class="nb" x="166" y="767">⑥</text>
  <text class="l" x="190" y="767">exit code 0 · 1 · 2 · 3 · 4 · 125 · 130 → 잡 성공/실패 (3은 notice와 성공)</text>
</svg>
</body></html>
