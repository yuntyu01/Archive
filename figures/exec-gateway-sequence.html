<!DOCTYPE html>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  html,body{margin:0;padding:0;background:#f6f6f6}
  svg{display:block}

  .ind{fill:#6d73ce}

  .lb{font-size:17px;font-weight:700;fill:#6d73ce;stroke:#f6f6f6;stroke-width:7px;stroke-linejoin:round;paint-order:stroke}
  .nb{font-size:17px;font-weight:700;fill:#6d73ce;stroke:#f6f6f6;stroke-width:7px;stroke-linejoin:round;paint-order:stroke}

</style>

<svg id="fig" width="1120" height="776" viewBox="0 0 1120 776" xmlns="http://www.w3.org/2000/svg">

  <text class="lb" x="144" y="714">바이트 그대로 중계</text>
