<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<title>Argo CD 배포 흐름</title>
<!-- 렌더: 1150x790, deviceScaleFactor 2 → public/images/posts/argocd-declarative-deploy/02.png -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  html,body{margin:0;padding:0;background:#f6f6f6}
  svg{display:block}

  .ind{fill:#6d73ce}

  .pur{fill:#c075e7}
  .rep{fill:#ffffff;stroke:#666666;stroke-width:2}

  .tk{font-size:23px;font-weight:600;fill:#000;text-anchor:middle}

  .bt{font-size:20px;font-weight:700;fill:#333}

  .ld{font-size:18px;font-weight:500;fill:#555}

</style>
</head><body>
<svg id="fig" width="1150" height="790" viewBox="0 0 1150 790" xmlns="http://www.w3.org/2000/svg">

  <rect width="1150" height="790" fill="#f6f6f6"/>

  <!-- 인터넷 -->

  <text class="s" x="135" y="212">API 서버 · Python</text>

  <rect class="box" x="300" y="92" width="570" height="500" rx="6"/>

  <path class="ad" d="M430 242V446"/>

  <!-- GitHub -->
  <rect class="box" x="900" y="92" width="220" height="500" rx="6"/>
  <text class="bl" x="916" y="119">GitHub</text>

  <rect class="gry" x="915" y="140" width="190" height="100" rx="10"/>
  <text class="t" x="1010" y="184">GHCR</text>
  <text class="s" x="1010" y="212">이미지 저장소</text>
  <path class="a" d="M842 190H911"/>
  <text class="l m mk" x="876" y="176">push</text>

  <text class="tk" x="1010" y="302">kodeploy-apps</text>

  <text class="sk" x="1010" y="351">values.yaml</text>

  <text class="sk" x="1010" y="483">형태 · 플랫폼 정책</text>
  <text class="sk" x="1010" y="506">templates/ · platform/</text>

  <!-- 값 · 형태 → Argo CD -->
  <path class="a" d="M913 340H770V446"/>
  <text class="l" x="784" y="414">값</text>
  <path class="a" d="M913 485H844"/>
  <text class="l m mk" x="878" y="473">형태</text>

  <path class="a" d="M585 572V636"/>
  <text class="l" x="599" y="612">적용</text>

  <rect class="ind" x="330" y="640" width="510" height="110" rx="10"/>
  <text class="t" x="585" y="686">테넌트 네임스페이스</text>
  <text class="s" x="585" y="716">Deployment · Service · HTTPRoute · NetworkPolicy · DB</text>

  <!-- 이미지 pull -->
  <path class="ad" d="M1107 190H1139V695H844"/>
  <text class="ld m" x="985" y="685">이미지 pull</text>

  <!-- core가 직접 하는 일 -->
  <path class="ad" d="M90 242V695H326"/>
  <text class="ld" x="40" y="728">네임스페이스 · Secret · PVC</text>
  <text class="ld" x="40" y="753">준비만 (워크로드는 안 씀)</text>
