<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<title>포트폴리오 Argo CD 전후</title>
<!-- 렌더: 1000x296, deviceScaleFactor 2 → webp로 바꿔 public/PORTFOLIO/index.html의 Argo CD 사례에 data URI로 넣는다 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  html,body{margin:0;padding:0;background:#fff}
  svg{display:block}
  text{font-family:Pretendard,"Noto Sans CJK KR",sans-serif}
  .b{fill:#fff;stroke:#d7dbe1;stroke-width:1.3}
  .t{font-size:17px;font-weight:700;fill:#1f2328;text-anchor:middle}
  .s{font-size:13.5px;font-weight:500;fill:#828d9a;text-anchor:middle}
  .sr{font-size:13.5px;font-weight:700;fill:#d1495b;text-anchor:middle}
  .sk{font-size:13.5px;font-weight:700;fill:#1f2328;text-anchor:middle}
  .row{font-size:15px;font-weight:800;fill:#1f2328}
  .zr{fill:none;stroke:#d1495b;stroke-width:1.3;stroke-dasharray:5 4}
  .zg{fill:none;stroke:#b9c0cb;stroke-width:1.3;stroke-dasharray:5 4}
  .zlr{font-size:13.5px;font-weight:700;fill:#d1495b}
  .zl{font-size:13.5px;font-weight:700;fill:#1f2328}
  .a{fill:none;stroke:#3f4650;stroke-width:1.5;marker-end:url(#ah)}
  .ar{fill:none;stroke:#d1495b;stroke-width:1.6;marker-end:url(#ahr)}
  .ag{fill:none;stroke:#2f9e63;stroke-width:1.9;marker-end:url(#ahg)}
  .l{font-size:13.5px;font-weight:600;fill:#3f4650;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
  .lr{font-size:13.5px;font-weight:700;fill:#d1495b;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
  .lg{font-size:13.5px;font-weight:700;fill:#2f9e63;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
  .sep{stroke:#e4e7eb;stroke-width:1}
</style>
</head><body>
<svg id="fig" width="1000" height="296" viewBox="0 0 1000 296" xmlns="http://www.w3.org/2000/svg">

  </defs>
  <rect width="1000" height="296" fill="#fff"/>

  <text class="row" x="20" y="96">Before</text>
  <text class="row" x="20" y="226">After</text>
  
  <!-- 외부 요청을 받는 곳 -->
  <rect class="zr" x="84" y="12" width="186" height="270" rx="8"/>

  <text class="s" x="910" y="109">앱 · DB</text>

  <rect class="b" x="94" y="186" width="160" height="70" rx="8"/>
  <text class="t" x="174" y="216">core</text>
  <text class="sk" x="174" y="239">전역 권한 6개</text>

  <path class="a" d="M256 221H336"/>
  <text class="l" x="296" y="211">값 커밋</text>

  <rect class="zg" x="560" y="150" width="210" height="132" rx="8"/>

  <rect class="b" x="590" y="186" width="164" height="70" rx="8"/>

  <rect class="b" x="840" y="186" width="140" height="70" rx="8"/>
  <text class="t" x="910" y="216">테넌트 ns</text>
  <text class="s" x="910" y="239">앱 · DB</text>
</svg>
</body></html>
